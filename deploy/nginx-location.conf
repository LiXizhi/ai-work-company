# Inside the existing TLS server. Define awc_api in the http context:
# limit_req_zone $binary_remote_addr zone=awc_api:10m rate=2r/s;
location = /ai-work-company { return 301 /ai-work-company/; }
location = /ai-work-company/company { return 301 /ai-work-company/company/; }
location = /ai-work-company/admin { return 301 /ai-work-company/admin/; }
location = /ai-work-company/free { return 301 /ai-work-company/free/; }
location /ai-work-company/ {
    proxy_pass http://127.0.0.1:5003/;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
location ~ ^/ai-work-company/(?:v1/|admin/api/) {
    limit_req zone=awc_api burst=20 nodelay;
    limit_req_status 429;
    rewrite ^/ai-work-company/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5003;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
