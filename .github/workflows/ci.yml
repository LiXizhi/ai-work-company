name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build:site
      - name: Run Live2D unit tests (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv tmp/live2d-ci
          tmp/live2d-ci/bin/pip install -r tools/live2d/requirements.txt
          tmp/live2d-ci/bin/python -m unittest discover -s tools/live2d -p "test_*.py"
