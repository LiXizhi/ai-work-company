<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar rig · 动作检查</title><link rel="stylesheet" href="world.css"><link rel="stylesheet" href="sprite-lab.css"></head><body><main class="lab"><a href="./">← 返回小城</a><h1>场景角色 · 分层动作检查</h1><p>直接使用 Haqi 原版 HeroRenderer 与姿态引擎。每个角色使用独立头部纹理与独立身体纹理。详细立绘仅用于角色档案和选择界面。</p><div class="lab-controls"><label>身体动作<select id="body-mode"><option value="idle">待机</option><option value="walk">行走</option></select></label><label>身体朝向<select id="facing"><option value="0">前</option><option value="1">左</option><option value="2">右</option><option value="3">后</option></select></label><label>头部动作<select id="head-mode"><option value="auto">Haqi 自动张望</option><option value="0">方向 0 · 0.0°</option><option value="1">方向 1 · 22.5°</option><option value="2">方向 2 · 45.0°</option><option value="3">方向 3 · 67.5°</option><option value="4">方向 4 · 90.0°</option><option value="5">方向 5 · 112.5°</option><option value="6">方向 6 · 135.0°</option><option value="7">方向 7 · 157.5°</option><option value="8">方向 8 · 180.0°</option><option value="9">方向 9 · 202.5°</option><option value="10">方向 10 · 225.0°</option><option value="11">方向 11 · 247.5°</option><option value="12">方向 12 · 270.0°</option><option value="13">方向 13 · 292.5°</option><option value="14">方向 14 · 315.0°</option><option value="15">方向 15 · 337.5°</option></select></label><label><input id="show-head" type="checkbox" checked>头部</label><label><input id="show-anchor" type="checkbox" checked>颈部锚点</label><button id="lab-pause" class="primary">暂停</button></div><p id="lab-status" role="status">正在加载分层图集…</p><div id="rig-cards"></div></main><script type="module" src="sprite-lab.js"></script></body></html>
